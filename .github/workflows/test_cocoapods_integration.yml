name: Test Cocoapods Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
    - develop

jobs:

  pods:
    runs-on: macos-12-xl
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
    - uses: n1hility/cancel-previous-runs@e709d8e41b16d5d0b8d529d293c5e126c57dc022 # v3.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
      with:
        xcode-version: latest-stable

    - name: Lint Cocoapods
      run: |
        gem install cocoapods -v 1.10.2
        pod repo update
        pod lib lint Adyen.podspec --allow-warnings --verbose

    - name: Test Cocoapods Integration
      run: |
        Scripts/test-CocoaPods-integration.sh -w
        Scripts/test-CocoaPods-integration.sh
