name: Update version number
on:
  workflow_dispatch:
    inputs:
      newVersion:
        description: 'The new version'
        required: true
jobs:

  Update:
    runs-on: macos-13
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0
    - uses: n1hility/cancel-previous-runs@e709d8e41b16d5d0b8d529d293c5e126c57dc022 # v3.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select latest Xcode
      uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
      with:
        xcode-version: latest-stable

    - name: Update version number
      run: |
        Scripts/increment_version.sh ${{ github.event.inputs.newVersion }}
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
      with:
        delete-branch: true
        branch: update-version-github-action
        commit-message: "chore: updated version"
        title: Update version
        body: Update version.
        token: ${{ secrets.GITHUB_TOKEN }}
